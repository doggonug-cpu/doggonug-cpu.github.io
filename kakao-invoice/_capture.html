<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>capture</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #frame { border: 0; display: block; background: #fff; }
  #report { position: fixed; right: 0; top: 0; width: 560px; max-height: 100vh; overflow: auto;
    margin: 0; padding: 10px; background: #111; color: #0f0; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; z-index: 9; }
</style>
</head>
<body>
<iframe id="frame" width="1280" height="720" title="capture frame"></iframe>
<pre id="report">loading…</pre>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var w = Number(q.get('w') || 1280);
  var h = Number(q.get('h') || 720);
  var sample = q.get('sample') || '';
  var target = q.get('scroll') || '';
  var frame = document.getElementById('frame');
  var report = document.getElementById('report');

  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.width = String(w);
  frame.height = String(h);

  function log(obj) {
    report.textContent = JSON.stringify(obj, null, 1);
    document.title = 'R:' + JSON.stringify(obj);
  }

  var boot = '<script>window.__errs=[];'
    + 'window.addEventListener("error",function(e){window.__errs.push("error: "+e.message+" @"+String(e.filename||"").split("/").pop()+":"+e.lineno);});'
    + 'window.addEventListener("unhandledrejection",function(e){window.__errs.push("rejection: "+String((e.reason&&e.reason.message)||e.reason));});'
    + '<\/script>';

  var base = location.href.replace(/_capture\.html.*$/, '');

  fetch('./index.html?t=' + Date.now()).then(function (r) { return r.text(); }).then(function (html) {
    frame.srcdoc = html.replace('<head>', '<head><base href="' + base + '">' + boot);
    frame.addEventListener('load', function () { window.setTimeout(run, 600); });
  }).catch(function (e) { log({ error: String(e) }); });

  function run() {
    var d = frame.contentDocument;
    try {
      if (sample) {
        var chip = d.querySelector('.chip[data-sample="' + sample + '"]');
        if (chip) { chip.click(); }
      }
      var node = null;
      if (target === 'paywall') { node = d.querySelector('.paywall-row'); }
      else if (target === 'table') { node = d.getElementById('tableWrap'); }
      else if (target === 'results') { node = d.getElementById('result-title'); }
      else if (target === 'pro') { node = d.getElementById('pro-title'); }
      if (node) { node.scrollIntoView({ block: target === 'paywall' ? 'end' : 'start' }); }
    } catch (err) { /* noop */ }
    window.setTimeout(measure, 500);
  }

  function measure() {
    var d = frame.contentDocument;
    var win = frame.contentWindow;
    var de = d.documentElement;
    var wide = [];
    Array.prototype.forEach.call(d.querySelectorAll('body *'), function (el) {
      var r = el.getBoundingClientRect();
      if (r.width > win.innerWidth + 1 && el.scrollWidth <= el.clientWidth + 1) {
        wide.push((el.tagName + (el.id ? '#' + el.id : '') + (el.className ? '.' + String(el.className).split(' ').join('.') : '')).slice(0, 70));
      }
    });
    log({
      size: [win.innerWidth, win.innerHeight],
      errors: (win.__errs || ['collector missing']).slice(0, 8),
      docOverflow: de.scrollWidth - de.clientWidth,
      bodyOverflow: d.body.scrollWidth - de.clientWidth,
      rows: d.querySelectorAll('#orderRows tr.order-row').length,
      paywall: !!d.querySelector('.paywall-row'),
      roi: String((d.querySelector('.roi-line') || {}).textContent || ''),
      counts: String((d.getElementById('counts') || {}).textContent || ''),
      wide: wide.slice(0, 6),
      scrollY: Math.round(win.scrollY)
    });
  }
})();
</script>
</body>
</html>
