name: seller-margin-pseo (주간 자동 재생성)

# seller-margin-pseo/ 폴더만 다시 만들고 커밋합니다.
# 루트 사이트(README, assets/, 다른 하위 폴더)는 건드리지 않습니다.

on:
  push:
    paths:
      - 'seller-margin-pseo/_src/**'
      - '.github/workflows/seller-margin-pseo.yml'
  schedule:
    # 매주 월요일 09:00 KST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seller-margin-pseo
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터에서 페이지 생성 및 검증
        run: python3 seller-margin-pseo/_src/build.py --check

      - name: 변경분 커밋 및 push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seller-margin-pseo
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore(pseo): 데이터에서 계산기 페이지 재생성"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "push 완료"
              exit 0
            fi
            echo "push 재시도 ${i}"
            sleep 5
          done
          echo "push 실패"
          exit 1
